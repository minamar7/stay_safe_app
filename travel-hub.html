<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travel Hub — Stay Safe Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #020617;
    --card: rgba(15,23,42,0.9);
    --accent: #38bdf8;
    --travel: #0ea5e9;
    --travel-dark: #0369a1;
    --gold: #facc15;
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --premium: #f59e0b;
}
* { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }
.hidden { display: none !important; }

/* ── HEADER ── */
.app-header {
    padding: 50px 20px 15px;
    background: rgba(15,23,42,0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(14,165,233,0.25);
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px;
}
.back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(14,165,233,0.12);
    border: 1px solid rgba(14,165,233,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    color: var(--accent); font-size: 18px;
}
.header-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.35rem; font-weight: 700;
    color: #fff; letter-spacing: 1px;
}

/* ── UI COMPONENTS ── */
.section-label { font-family: 'Rajdhani', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; padding: 18px 20px 8px; }
.tools-list { padding: 0 14px; display: flex; flex-direction: column; gap: 12px; }
.tool-row { background: var(--card); border-radius: 22px; border: 1px solid rgba(255,255,255,0.07); padding: 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; position: relative; }
.tool-icon-box { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.3); font-size: 24px; }
.tool-row-info h3 { margin: 0; font-size: 0.95rem; font-family: 'Rajdhani', sans-serif; }
.tool-row-info p { margin: 0; font-size: 0.7rem; color: var(--muted); }
.premium-badge { position: absolute; top: 10px; right: 12px; background: var(--premium); color: #000; font-size: 0.5rem; font-weight: 900; padding: 2px 6px; border-radius: 4px; font-family: 'Rajdhani'; }

/* ── PANELS ── */
.tool-panel { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; }
.panel-body { flex: 1; overflow-y: auto; padding: 20px; }

/* ── MAP & CARDS ── */
#map_wrap { flex: 1; position: relative; background: #020e1f; overflow: hidden; min-height: 300px; }
#flight_canvas { display: block; width: 100%; height: 100%; }
.result-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(56,189,248,0.2); border-radius: 20px; padding: 20px; margin-top: 15px; }
</style>
</head>
<body>

<div id="main_page">
    <header class="app-header">
        <div class="back-btn" onclick="window.history.back()">‹</div>
        <div class="header-title">✈ <span>Travel Hub</span></div>
    </header>

    <div class="section-label">Safety Tools</div>
    <div class="tools-list">
        <div class="tool-row" onclick="openPanel('panel_threat')">
            <div class="tool-icon-box">🤖</div>
            <div class="premium-badge">AI FLASH</div>
            <div class="tool-row-info">
                <h3>Travel AI Threat</h3>
                <p>Global Risk & Safety Analysis</p>
            </div>
        </div>

        <div class="tool-row" onclick="openPanel('panel_flight')">
            <div class="tool-icon-box">✈️</div>
            <div class="premium-badge">LIVE</div>
            <div class="tool-row-info">
                <h3>Flight Tracker</h3>
                <p>Real-time position & status</p>
            </div>
        </div>
    </div>
</div>

<div id="panel_threat" class="tool-panel hidden">
    <header class="app-header">
        <div class="back-btn" onclick="closePanel('panel_threat')">‹</div>
        <div class="header-title">🤖 AI Analyzer</div>
    </header>
    <div class="panel-body">
        <div style="display:flex; gap:10px;">
            <input id="threat_country" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--accent); border-radius:12px; padding:12px; color:#fff;" placeholder="Country (e.g. Japan)">
            <button onclick="runTravelAI()" id="btn_ai" style="background:var(--travel); border:none; border-radius:12px; padding:0 20px; color:#fff; font-weight:bold;">SCAN</button>
        </div>
        <div id="threat_output"></div>
    </div>
</div>

<div id="panel_flight" class="tool-panel hidden">
    <header class="app-header">
        <div class="back-btn" onclick="closePanel('panel_flight')">‹</div>
        <div class="header-title">✈️ Live Tracker</div>
    </header>
    <div style="padding:10px; background:rgba(15,23,42,0.9); display:flex; gap:8px;">
        <input id="fl_input" style="flex:1; background:rgba(255,255,255,0.06); border:1px solid var(--accent); border-radius:12px; padding:10px; color:#fff;" placeholder="Flight No (e.g. AEE600)">
        <button onclick="searchFlight()" style="background:var(--travel); border:none; border-radius:12px; padding:10px 16px; color:#fff; font-weight:bold;">TRACK</button>
    </div>
    <div id="map_wrap">
        <canvas id="flight_canvas"></canvas>
        <div id="fl_card" style="display:none; position:absolute; bottom:20px; left:20px; right:20px; background:rgba(15,23,42,0.95); border:1px solid var(--accent); border-radius:15px; padding:15px;"></div>
    </div>
</div>

<script>
// --- KEYS ---
const FLIGHT_API_KEY = "Aviation_Api_Key"; 
const AI_THREAT_KEY = "Travel_Ai_Threat";

function openPanel(id) { document.getElementById(id).classList.remove('hidden'); if(id==='panel_flight') initMap(); }
function closePanel(id) { document.getElementById(id).classList.add('hidden'); }

// --- TRAVEL AI LOGIC (Travel_Ai_Threat) ---
async function runTravelAI() {
    const country = document.getElementById('threat_country').value;
    const output = document.getElementById('threat_output');
    if(!country) return;

    output.innerHTML = "<p style='color:var(--muted); margin-top:20px;'>AI is analyzing security protocols...</p>";
    
    try {
        // Εδώ χρησιμοποιούμε το σωστό endpoint για το Gemini / AI Threat
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AI_THREAT_KEY}`, {
            method: 'POST',
            body: JSON.stringify({
                contents: [{ parts: [{ text: `Provide a travel safety analysis for ${country}. Include: 1. Weather, 2. Mandatory Vaccines, 3. Crime Risk, 4. Top Landmarks, 5. Safety Score (1-10). Format as JSON.` }]}]
            })
        });
        const data = await response.json();
        const aiText = data.candidates[0].content.parts[0].text;
        
        output.innerHTML = `<div class="result-card"><pre style="white-space:pre-wrap; font-size:0.8rem; color:#ccc;">${aiText}</pre></div>`;
    } catch(e) {
        output.innerHTML = "<p style='color:var(--danger);'>Connection Error. Check API Key.</p>";
    }
}

// --- FLIGHT TRACKER LOGIC ---
let canvas, ctx, animationId;
let view = { x: 0, y: 0, zoom: 1 };

function initMap() {
    canvas = document.getElementById('flight_canvas');
    ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    drawBaseMap();
}

function drawBaseMap() {
    ctx.fillStyle = "#020e1f";
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.strokeStyle = "#1e3a8a";
    ctx.strokeRect(50,50, canvas.width-100, canvas.height-100);
}

async function searchFlight() {
    const flightNo = document.getElementById('fl_input').value.trim();
    const card = document.getElementById('fl_card');
    if(!flightNo) return;

    card.style.display = "block";
    card.innerHTML = "Searching satellite data...";

    try {
        // Χρήση AviationStack ή OpenSky με το Key σου
        const res = await fetch(`https://api.aviationstack.com/v1/flights?access_key=${FLIGHT_API_KEY}&flight_iata=${flightNo}`);
        const data = await res.json();
        
        if(data.data && data.data.length > 0) {
            const f = data.data[0];
            card.innerHTML = `
                <b style="color:var(--accent)">${f.flight.iata}</b> 
                <span style="float:right; color:var(--success)">● ${f.flight_status.toUpperCase()}</span>
                <div style="margin-top:10px; font-size:0.8rem;">
                    From: ${f.departure.airport}<br>
                    To: ${f.arrival.airport}<br>
                    Airline: ${f.airline.name}
                </div>
            `;
        } else {
            card.innerHTML = "No active flight found with this number.";
        }
    } catch(e) {
        card.innerHTML = "API Connection Error.";
    }
}
</script>
</body>
</html>
