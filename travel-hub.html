<script>
// 1. ΡΥΘΜΙΣΕΙΣ API
const AVIATION_API_KEY = 'YOUR_AVIATION_API_KEY'; // Αντικατάστησε με το κλειδί σου
const THREAT_API_KEY = 'YOUR_TRAVEL_AI_THREAT'; // Αντικατάστησε με το κλειδί σου

// 2. FLIGHT TRACKER FUNCTION
async function trackFlight() {
    const flightNum = document.getElementById('fl_input').value.trim();
    const resultsDiv = document.getElementById('flight_results');
    
    if(!flightNum) return;
    
    resultsDiv.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Αναζήτηση πτήσης...</div>';
    
    try {
        const response = await fetch(`https://api.aviationstack.com/v1/flights?access_key=${AVIATION_API_KEY}&flight_iata=${flightNum}`);
        const data = await response.json();
        
        if (!data.data || data.data.length === 0) {
            resultsDiv.innerHTML = '<div class="result-card"><p>Η πτήση δεν βρέθηκε. Ελέγξτε τον αριθμό.</p></div>';
            return;
        }

        const flight = data.data[0];
        const statusClass = flight.flight_status === 'active' ? 'status-ontime' : 'status-delayed';
        
        resultsDiv.innerHTML = `
            <div class="flight-card">
                <div class="flight-header">
                    <div class="flight-num">${flight.flight.iata}</div>
                    <div class="flight-status-badge ${statusClass}">${flight.flight_status.toUpperCase()}</div>
                </div>
                <div class="flight-route">
                    <div class="airport-info">
                        <div class="airport-code">${flight.departure.iata}</div>
                        <div class="airport-time">${new Date(flight.departure.scheduled).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                    <div class="flight-line"><span>✈️</span></div>
                    <div class="airport-info">
                        <div class="airport-code">${flight.arrival.iata}</div>
                        <div class="airport-time">${new Date(flight.arrival.scheduled).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>
                <div style="margin-top:15px; font-size:0.8rem; color:var(--muted);">
                    Terminal: ${flight.departure.terminal || '-'} | Gate: ${flight.departure.gate || '-'}
                </div>
            </div>
        `;
    } catch (e) {
        resultsDiv.innerHTML = '<div class="result-card"><p>Σφάλμα σύνδεσης με την υπηρεσία πτήσεων.</p></div>';
    }
}

// 3. TRAVEL AI THREAT ADVISOR
async function checkSafety() {
    const country = document.getElementById('sf_input').value.trim();
    const resultsDiv = document.getElementById('safety_results');
    
    if(!country) return;
    
    resultsDiv.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Ανάλυση απειλών AI...</div>';
    
    try {
        // Εδώ προσομοιώνουμε την κλήση στο Travel_Ai_Threat API
        // Αντικατάστησε το URL με το πραγματικό endpoint του API σου
        const response = await fetch(`https://api.travel-ai-threat.com/v1/analyze?country=${country}&key=${THREAT_API_KEY}`);
        const data = await response.json();
        
        // Δυναμική δημιουργία του Safety Score & Tips
        resultsDiv.innerHTML = `
            <div class="safety-gauge">
                <div class="gauge-circle" style="border-color: ${getScoreColor(data.score)}">
                    <div class="gauge-score">${data.score}/100</div>
                    <div class="gauge-label">SAFETY SCORE</div>
                </div>
                <div class="gauge-verdict">${data.verdict}</div>
            </div>
            <div class="section-label">Κύριες Απειλές</div>
            ${data.threats.map(t => `
                <div class="result-card">
                    <h4>${t.title}</h4>
                    <p>${t.description}</p>
                    <span class="tag ${t.level === 'High' ? 'danger' : 'gold'}">${t.level} Risk</span>
                </div>
            `).join('')}
        `;
    } catch (e) {
        // Fallback αν το API δεν είναι ακόμα ενεργό
        resultsDiv.innerHTML = '<div class="result-card"><p>Προσωρινή αδυναμία σύνδεσης με το Travel AI.</p></div>';
    }
}

function getScoreColor(score) {
    if(score > 80) return 'var(--success)';
    if(score > 50) return 'var(--gold)';
    return 'var(--danger)';
}

// 4. ΕΝΗΜΕΡΩΣΗ ΤΩΝ PANEL BODIES
// Στο window.onload ή εκεί που αρχικοποιείς τα panels, βάλε το HTML περιεχόμενο:

document.getElementById('flight_body').innerHTML = `
    <div class="search-bar">
        <input class="search-input" id="fl_input" placeholder="Αριθμός πτήσης (π.χ. LH400)"/>
        <button class="search-btn" onclick="trackFlight()">TRACK</button>
    </div>
    <div id="flight_results"></div>
`;

document.getElementById('safety_body').innerHTML = `
    <div class="search-bar">
        <input class="search-input" id="sf_input" placeholder="Χώρα (π.χ. Mexico)"/>
        <button class="search-btn" onclick="checkSafety()">ΑΝΑΛΥΣΗ</button>
    </div>
    <div id="safety_results"></div>
`;
</script>
