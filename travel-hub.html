<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travel Hub — Stay Safe Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #020617;
    --card: rgba(15,23,42,0.9);
    --accent: #38bdf8;
    --travel: #0ea5e9;
    --travel-dark: #0369a1;
    --gold: #facc15;
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --premium: #f59e0b;
}
* { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }
.hidden { display: none !important; }

/* ── HEADER ── */
.app-header {
    padding: 50px 20px 15px;
    background: rgba(15,23,42,0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(14,165,233,0.25);
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px;
}
.back-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(14,165,233,0.12);
    border: 1px solid rgba(14,165,233,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    color: var(--accent); font-size: 18px;
    transition: background 0.2s;
}
.back-btn:active { background: rgba(14,165,233,0.25); }
.header-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.35rem; font-weight: 700;
    color: #fff; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
}
.header-title span { color: var(--accent); }

/* ── HERO STRIP ── */
.travel-hero {
    background: linear-gradient(135deg, rgba(3,105,161,0.4), rgba(2,6,23,0.8));
    border-bottom: 1px solid rgba(14,165,233,0.15);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
}
.hero-globe { width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; box-shadow: 0 0 16px rgba(14,165,233,0.5); }
.hero-text h2 { margin: 0 0 3px; font-size: 1rem; font-weight: 800; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.5px; }
.hero-text p { margin: 0; font-size: 0.72rem; color: var(--muted); }

/* ── SECTION LABEL ── */
.section-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.62rem; font-weight: 700;
    letter-spacing: 2.5px; color: var(--muted);
    text-transform: uppercase;
    padding: 18px 20px 8px;
}

/* ── TOOL CARDS ── */
.tools-list { padding: 0 14px; display: flex; flex-direction: column; gap: 12px; }
.tool-row {
    background: var(--card); border-radius: 22px; border: 1px solid rgba(255,255,255,0.07);
    padding: 18px; display: flex; align-items: center; gap: 14px; cursor: pointer;
    position: relative; overflow: hidden; transition: transform 0.15s;
}
.tool-row:active { transform: scale(0.97); }
.tool-icon-box { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 24px; }
.tool-row-info { flex: 1; min-width: 0; }
.tool-row-info h3 { margin: 0 0 3px; font-size: 0.95rem; font-weight: 800; font-family: 'Rajdhani', sans-serif; letter-spacing: 0.3px; }
.tool-row-info p { margin: 0; font-size: 0.7rem; color: var(--muted); line-height: 1.4; }
.tool-arrow { color: var(--muted); font-size: 18px; flex-shrink: 0; }

.tool-free { border-color: rgba(14,165,233,0.2); }
.tool-free .tool-icon-box { background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.3); }

.tool-premium { border-color: rgba(245,158,11,0.2); }
.tool-premium .tool-icon-box { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.28); }
.premium-badge { position: absolute; top: 10px; right: 12px; background: var(--premium); color: #000; font-size: 0.46rem; font-weight: 900; padding: 2px 7px; border-radius: 5px; letter-spacing: 1.5px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }

/* ── PANELS ── */
.tool-panel { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; overflow: hidden; }
.panel-header { padding: 50px 20px 14px; background: rgba(15,23,42,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(14,165,233,0.2); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.panel-title { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff; }
.flight-num { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); }

</style>
</head>
<body>

<div id="main_page">
    <header class="app-header">
        <div class="back-btn" onclick="window.history.back()">‹</div>
        <div class="header-title">✈ <span id="txt_hub_title">Travel Hub</span></div>
    </header>

    <div class="travel-hero">
        <svg class="hero-globe" width="52" height="52" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="98" fill="#0d3d6e"/>
            <path d="M50 40 Q80 10 120 40 T150 80" fill="none" stroke="#38bdf8" stroke-width="2"/>
        </svg>
        <div class="hero-text">
            <h2 id="txt_hero_title">Travel Safety Center</h2>
            <p id="txt_hero_sub">Stay protected in every flight</p>
        </div>
    </div>

    <div class="section-label" id="txt_free_label">Free Tools</div>
    <div class="tools-list">
        <div class="tool-row tool-free" onclick="openPanel('panel_emergency')">
            <div class="tool-icon-box">🆘</div>
            <div class="tool-row-info"><h3 id="txt_em_title">Emergency Numbers</h3><p id="txt_em_sub">Police, Ambulance, Fire</p></div>
            <div class="tool-arrow">›</div>
        </div>
    </div>

    <div class="section-label" id="txt_premium_label">Premium Tools</div>
    <div class="tools-list">
        <div class="tool-row tool-premium" onclick="openPanel('panel_flight')">
            <div class="tool-icon-box">✈️</div>
            <div class="premium-badge">PREMIUM</div>
            <div class="tool-row-info"><h3 id="txt_fl_title">Flight Tracker</h3><p id="txt_fl_sub">Live status, gates, delays</p></div>
            <div class="tool-arrow">›</div>
        </div>
    </div>
</div>

<div id="panel_flight" class="tool-panel hidden">
    <div class="panel-header">
        <div class="back-btn" onclick="closePanel('panel_flight')">‹</div>
        <div class="panel-title">✈️ <span id="txt_fl_p_title">Flight Tracker</span></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;position:relative;">
        <div style="padding:10px;background:rgba(2,6,23,0.9);display:flex;gap:8px;z-index:10;">
            <input id="fl_input" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(14,165,233,0.3);border-radius:12px;padding:10px;color:#fff;" placeholder="e.g. AEE600" oninput="this.value=this.value.toUpperCase()">
            <button onclick="searchFlightLive()" style="background:#0ea5e9;border:none;border-radius:12px;padding:10px 16px;color:#fff;font-weight:bold;">TRACK</button>
        </div>
        <div id="map_wrap" style="flex:1;position:relative;overflow:hidden;background:#020e1f;touch-action:none;">
            <canvas id="flight_canvas"></canvas>
            <div id="fl_counter" style="position:absolute;top:10px;right:10px;background:rgba(2,6,23,0.8);border-radius:20px;padding:4px 10px;font-size:10px;color:#38bdf8;">✈ <span id="fl_count">—</span> LIVE</div>
        </div>
        <div id="fl_info_card" style="display:none;background:rgba(2,6,23,0.95);padding:15px;border-top:1px solid #38bdf8;"></div>
    </div>
</div>

<script>
// --- MULTILINGUAL LOGIC ---
const STRINGS = {
    en: {
        hub_title: "Travel Hub", hero_title: "Travel Safety Center", hero_sub: "Stay protected in every flight",
        free_label: "Free Tools", em_title: "Emergency Numbers", em_sub: "Police, Ambulance, Fire",
        premium_label: "Premium Tools", fl_title: "Flight Tracker", fl_sub: "Live status, gates, delays",
        fl_p_title: "Flight Tracker", search_ph: "e.g. AEE600", track_btn: "TRACK", live_count: "LIVE"
    },
    el: {
        hub_title: "Travel Hub", hero_title: "Κέντρο Ασφάλειας Ταξιδιών", hero_sub: "Προστατευμένος σε κάθε πτήση",
        free_label: "ΔΩΡΕΑΝ ΕΡΓΑΛΕΙΑ", em_title: "Αριθμοί Έκτακτης Ανάγκης", em_sub: "Αστυνομία, Ασθενοφόρο, Πυροσβεστική",
        premium_label: "PREMIUM ΕΡΓΑΛΕΙΑ", fl_title: "Παρακολούθηση Πτήσης", fl_sub: "Live κατάσταση, πύλες, καθυστερήσεις",
        fl_p_title: "Παρακολούθηση Πτήσης", search_ph: "π.χ. AEE600", track_btn: "ΑΝΑΖΗΤΗΣΗ", live_count: "LIVE"
    }
};

let currentLang = 'en'; // DEFAULT LANGUAGE SET TO ENGLISH

function updateUI() {
    const t = STRINGS[currentLang];
    document.getElementById('txt_hub_title').textContent = t.hub_title;
    document.getElementById('txt_hero_title').textContent = t.hero_title;
    document.getElementById('txt_hero_sub').textContent = t.hero_sub;
    document.getElementById('txt_free_label').textContent = t.free_label;
    document.getElementById('txt_em_title').textContent = t.em_title;
    document.getElementById('txt_em_sub').textContent = t.em_sub;
    document.getElementById('txt_premium_label').textContent = t.premium_label;
    document.getElementById('txt_fl_title').textContent = t.fl_title;
    document.getElementById('txt_fl_sub').textContent = t.fl_sub;
    document.getElementById('txt_fl_p_title').textContent = t.fl_p_title;
    document.getElementById('fl_input').placeholder = t.search_ph;
}

// --- FLIGHT TRACKER LOGIC ---
let canvas, ctx, flPlanes = [], flInterval;
let view = { offsetX: 0, offsetY: 0, scale: 1.5 };

function initFlightMap() {
    canvas = document.getElementById('flight_canvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    fetchFlights();
    if (flInterval) clearInterval(flInterval);
    flInterval = setInterval(fetchFlights, 30000);
    animate();
}

function resizeCanvas() {
    const wrap = document.getElementById('map_wrap');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
}

async function fetchFlights() {
    try {
        const res = await fetch('https://opensky-network.org/api/states/all');
        const data = await res.json();
        if (data && data.states) {
            flPlanes = data.states.filter(s => s[5] && s[6]).slice(0, 300).map(s => ({
                callsign: s[1].trim(), lon: s[5], lat: s[6], heading: s[10] || 0
            }));
            document.getElementById('fl_count').textContent = flPlanes.length;
        }
    } catch(e) { console.log("Demo mode"); loadDemoData(); }
}

function loadDemoData() {
    flPlanes = [];
    for(let i=0; i<50; i++) {
        flPlanes.push({ callsign: 'FL'+(100+i), lat: 30+Math.random()*20, lon: 10+Math.random()*30, heading: Math.random()*360 });
    }
    document.getElementById('fl_count').textContent = flPlanes.length + " (DEMO)";
}

function animate() {
    ctx.fillStyle = '#020e1f'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(56,189,248,0.1)';
    for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
    
    flPlanes.forEach(p => {
        const x = ((p.lon + 180) / 360) * canvas.width * view.scale + view.offsetX;
        const y = ((85 - p.lat) / 170) * canvas.height * view.scale + view.offsetY;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((p.heading - 90) * Math.PI / 180);
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(8,0); ctx.lineTo(-4,-4); ctx.lineTo(-2,0); ctx.lineTo(-4,4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
    });
    requestAnimationFrame(animate);
}

function searchFlightLive() {
    const val = document.getElementById('fl_input').value;
    if(!val) return;
    const card = document.getElementById('fl_info_card');
    card.style.display = 'block';
    card.innerHTML = `<div class="flight-num">${val}</div><p style="color:#22c55e;font-size:12px;">ON TIME</p><p style="font-size:11px;color:var(--muted);">Tracking live coordinates...</p>`;
}

function openPanel(id) { document.getElementById(id).classList.remove('hidden'); if(id==='panel_flight') initFlightMap(); }
function closePanel(id) { document.getElementById(id).classList.add('hidden'); }

window.onload = updateUI;
</script>
</body>
</html>
