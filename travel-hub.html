<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AI Threat Analyzer – Stay Safe Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#020617"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #020917;
  --accent: #38bdf8;
  --danger: #ef4444;
  --safe: #22c55e;
  --warn: #f59e0b;
  --panel: rgba(15, 23, 42, 0.9);
}*{box-sizing:border-box;margin:0;padding:0} body{ background:var(--bg); color:#fff; font-family:Rajdhani,sans-serif; min-height:100vh; }

.bg-grid{ position:fixed;inset:0;z-index:0; background-image:linear-gradient(rgba(56,189,248,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.03) 1px,transparent 1px); background-size:40px 40px; }

.shell{position:relative;z-index:2;max-width:480px;margin:auto;padding:20px 20px 100px;display:flex;flex-direction:column;gap:16px}

.nav-header{display:flex} .btn-back{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 14px;border-radius:12px;color:#94a3b8;text-decoration:none;font-family:Orbitron}

.header-badge{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25);padding:6px 12px;border-radius:20px;font-size:12px;color:var(--accent);width:max-content}

h1{font-family:Orbitron;font-size:1.6rem} h1 span{color:var(--accent)}

.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .scenario-btn{background:var(--panel);border:1px solid rgba(255,255,255,0.08);padding:14px;border-radius:14px;cursor:pointer;text-align:center} .scenario-btn.active{border-color:var(--accent)} .icon{font-size:1.8rem}

textarea{width:100%;min-height:120px;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;color:#fff}

button.main{ width:100%;padding:16px;background:linear-gradient(135deg,#0ea5e9,#0284c7); border:none;border-radius:14px;color:#fff;font-family:Orbitron;font-weight:700 }

.card{display:none;margin-top:10px;background:var(--panel);border-radius:16px;overflow:hidden} .card.show{display:block} .header{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid rgba(255,255,255,0.08)} .score{font-size:2rem;font-family:Orbitron} .content{padding:14px;font-size:14px;line-height:1.6}

.travel-box{margin-top:10px;padding:12px;background:rgba(56,189,248,0.08);border-radius:12px;border:1px solid rgba(56,189,248,0.2)} .travel-title{color:var(--accent);font-weight:700;margin-bottom:6px} </style>

</head>
<body>
<div class="bg-grid"></div><div class="shell">  <div class="nav-header">
    <a class="btn-back" href="index.html">← BACK</a>
  </div>  <div class="header-badge">AI ANALYZER v3 ENTERPRISE</div>
  <h1>🤖 <span>ELITE</span> ANALYSIS</h1>  <div class="scenario-grid">
    <div class="scenario-btn active" onclick="setMode('personal',this)"><div class="icon">🛡️</div>Personal</div>
    <div class="scenario-btn" onclick="setMode('cyber',this)"><div class="icon">🔐</div>Cyber</div>
    <div class="scenario-btn" onclick="setMode('emergency',this)"><div class="icon">🆘</div>Emergency</div>
    <div class="scenario-btn" onclick="setMode('travel',this)"><div class="icon">🌍</div>Travel</div>
  </div>  <textarea id="input" placeholder="Describe situation or country..."></textarea><button class="main" onclick="runAI()">START SCAN</button>

  <div class="card" id="card">
    <div class="header">
      <div id="level">—</div>
      <div class="score" id="score">—</div>
    </div>
    <div class="content" id="output"></div>
  </div></div><script>
let mode='personal';

function setMode(m,el){
  mode=m;
  document.querySelectorAll('.scenario-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function renderTravel(data){
  if(!data?.travel_data) return '';
  const t=data.travel_data;

  return `
  <div class="travel-box">
    <div class="travel-title">🌍 Travel Intelligence</div>
    <div><b>Country:</b> ${t.country_detected||'-'}</div>
    <div><b>Weather:</b> ${t.weather||'-'}</div>
    <div><b>Risks:</b> ${JSON.stringify(t.risks||{})}</div>
    <div><b>Packing:</b> ${(t.packing_list||[]).join(', ')}</div>
    <div><b>Vaccines:</b> ${(t.vaccines||[]).join(', ')}</div>
  </div>
  `;
}

async function runAI(){
  const input=document.getElementById('input').value;

  const res=await fetch('https://stay-safe-tips.vercel.app/api/analyze',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({situation:input,scenario:mode})
  });

  const data=await res.json();

  document.getElementById('card').classList.add('show');
  document.getElementById('level').innerText=data.level||'-';
  document.getElementById('score').innerText=(data.score||0)+'%';

  let html=`<div>${data.summary||data.assessment||''}</div>`;
  html+=renderTravel(data);

  document.getElementById('output').innerHTML=html;
}
</script></body>
</html>
